name: Supabase Keep Alive Ping

on:
  schedule:
    # Runs at 00:00 (Midnight) on Sundays (0) and Wednesdays (3)
    - cron: '0 0 * * 0,3'
  workflow_dispatch: 
    # Allows you to manually trigger the workflow from the GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        # The continue-on-error flag ensures the GitHub Action always shows as "Success" (Green)
        # even if the Supabase project happens to be temporarily down or unresponsive.
        continue-on-error: true
        run: |
          # A simple GET request to fetch 1 row. It is completely read-only and makes no changes.
          # The '--max-time 10' prevents it from hanging.
          # The '|| true' guarantees the script exits without throwing a fatal error code.
          curl --silent --show-error --max-time 10 \
            "${SUPABASE_URL}/rest/v1/products?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" || true
